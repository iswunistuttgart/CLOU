[project]
name = "embedding-service"
license = "Apache-2.0"
version = "0.1.0"
description = "Standalone embedding service for semantic search"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.30.6",
    "sentence-transformers>=3.3.1",
    "torch>=2.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
